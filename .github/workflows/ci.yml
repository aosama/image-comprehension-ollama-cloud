name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Verify dependencies
        run: |
          command -v curl
          command -v jq
          command -v base64

      - name: Verify script help works
        run: ./skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh --help

      - name: Verify script fails gracefully without API key
        run: |
          unset OLLAMA_CLOUD_API_KEY
          if ./skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh --image /dev/null 2>/dev/null; then
            echo "ERROR: Script should fail without OLLAMA_CLOUD_API_KEY"
            exit 1
          else
            echo "PASS: Script correctly fails without API key"
          fi

  smoke-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Smoke test with Ollama Cloud
        env:
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: |
          if [ -z "${OLLAMA_CLOUD_API_KEY}" ]; then
            echo "SKIP: OLLAMA_CLOUD_API_KEY secret is not configured. Skipping smoke test."
            exit 0
          fi
          ./skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh --test