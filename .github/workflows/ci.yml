name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Make scripts executable
        if: runner.os != 'Windows'
        run: chmod +x skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Verify dependencies
        run: |
          command -v curl
          command -v jq
          command -v base64

      - name: Verify script help exits 0
        run: |
          if ! ./skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh --help >/dev/null 2>&1; then
            echo "ERROR: --help should exit with code 0"
            exit 1
          else
            echo "PASS: --help exits 0"
          fi

      - name: Verify script fails gracefully without API key
        run: |
          unset OLLAMA_CLOUD_API_KEY
          if ./skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh --image /dev/null 2>/dev/null; then
            echo "ERROR: Script should fail without OLLAMA_CLOUD_API_KEY"
            exit 1
          else
            echo "PASS: Script correctly fails without API key"
          fi

      - name: Verify script fails when a dependency is missing
        run: |
          JQ_PATH="$(command -v jq)"
          sudo mv "$JQ_PATH" "${JQ_PATH}.bak" 2>/dev/null || mv "$JQ_PATH" "${JQ_PATH}.bak" 2>/dev/null || true
          if command -v jq >/dev/null 2>&1; then
            echo "WARN: Could not remove jq from PATH, skipping test"
            sudo mv "${JQ_PATH}.bak" "$JQ_PATH" 2>/dev/null || mv "${JQ_PATH}.bak" "$JQ_PATH" 2>/dev/null || true
          elif ./skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh --image /dev/null 2>/dev/null; then
            echo "ERROR: Script should fail when jq is missing"
            sudo mv "${JQ_PATH}.bak" "$JQ_PATH" 2>/dev/null || mv "${JQ_PATH}.bak" "$JQ_PATH" 2>/dev/null || true
            exit 1
          else
            echo "PASS: Script correctly fails when a dependency is missing"
          fi
          sudo mv "${JQ_PATH}.bak" "$JQ_PATH" 2>/dev/null || mv "${JQ_PATH}.bak" "$JQ_PATH" 2>/dev/null || true

      - name: Verify script rejects unsupported image format
        run: |
          export OLLAMA_CLOUD_API_KEY="fake-key-for-test"
          echo "not an image" > /tmp/test_unsupported.txt
          if ./skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh --image /tmp/test_unsupported.txt 2>/dev/null; then
            echo "ERROR: Script should reject .txt files"
            exit 1
          else
            echo "PASS: Script correctly rejects unsupported image formats"
          fi

      - name: Verify script reports missing image file
        run: |
          export OLLAMA_CLOUD_API_KEY="fake-key-for-test"
          if ./skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh --image /nonexistent/path/fake_image.png 2>/dev/null; then
            echo "ERROR: Script should fail for nonexistent image file"
            exit 1
          else
            echo "PASS: Script correctly reports missing image file"
          fi

      - name: End-to-end smoke test with Ollama Cloud
        env:
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: |
          if [ -z "${OLLAMA_CLOUD_API_KEY:-}" ]; then
            echo "SKIP: OLLAMA_CLOUD_API_KEY secret is not configured. Skipping E2E smoke test."
            exit 0
          fi
          ./skills/image-comprehension-ollama-cloud/scripts/comprehend_image_ollama_cloud.sh --test